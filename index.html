<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Hedera Mainnet Consensus 3D</title>
        <meta
            name="description"
            content="Live 3D view of Hedera mainnet: the real consensus nodes, their stake, and every transaction placed at its real consensus timestamp, streamed from the public mirror node." />
        <meta name="theme-color" content="#eef1f6" />
        <script>
            // Apply the saved theme before first paint so dark-mode visitors see no light flash.
            // Light is the default. Keep the key in sync with STORAGE_KEYS.theme in src/config.ts.
            try {
                if (localStorage.getItem("hedera-tower-theme") === "dark")
                    document.documentElement.dataset.theme = "dark";
            } catch {
                /* storage blocked: stay light */
            }
        </script>
        <link rel="canonical" href="https://hedera-3d.netlify.app/" />
        <!-- link previews (LinkedIn, Slack, X, ...) -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Hedera Mainnet Consensus 3D" />
        <meta property="og:title" content="Hedera mainnet consensus, live in 3D" />
        <meta
            property="og:description"
            content="Every Hedera mainnet transaction at its real consensus timestamp, on the real nodes sized by stake. Streamed live from the public mirror node." />
        <meta property="og:url" content="https://hedera-3d.netlify.app/" />
        <meta property="og:image" content="https://hedera-3d.netlify.app/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="A 3D tower of live Hedera transactions with node, ledger and chart panels" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Hedera mainnet consensus, live in 3D" />
        <meta name="twitter:image" content="https://hedera-3d.netlify.app/og.png" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
            rel="stylesheet" />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
